<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <script>
      // Componente para la explosión de huellitas
      AFRAME.registerComponent('exploding-paws', {
        init: function () {
          this.el.addEventListener('targetFound', event => {
            const entity = this.el;
            // Crear 10 huellitas en posiciones aleatorias
            for (let i = 0; i < 12; i++) {
              let paw = document.createElement('a-image');
              paw.setAttribute('src', '#huella');
              paw.setAttribute('scale', '0.1 0.1 0.1');
              paw.setAttribute('position', '0 0 0');
              
              // Animación de explosión (hacia afuera)
              let destX = (Math.random() - 0.5) * 2;
              let destY = (Math.random() - 0.5) * 2;
              let destZ = Math.random() * 0.5;
              
              paw.setAttribute('animation', {
                property: 'position',
                to: `${destX} ${destY} ${destZ}`,
                dur: 1500,
                easing: 'easeOutExpo'
              });
              
              // Animación de desvanecimiento
              paw.setAttribute('animation__fade', {
                property: 'material.opacity',
                from: 1,
                to: 0,
                dur: 1500,
                easing: 'linear'
              });

              entity.appendChild(paw);
              
              // Eliminar la entidad después de la animación para no saturar
              setTimeout(() => { paw.remove(); }, 1600);
            }
          });
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>

    <a-scene 
      mindar-image="imageTargetSrc: ./Mitsuki.mind; filterMinCF:0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <a-asset-item id="gatoModel" src="./GATO1.glb"></a-asset-item>
        <img id="tarjetaImg" src="./Tarjeta.png">
        <img id="huella" src="https://cdn-icons-png.flaticon.com/512/107/107831.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" exploding-paws>
        
        <a-gltf-model 
          src="#gatoModel" 
          rotation="90 0 0" 
          position="0 0 0.1" 
          scale="0.2 0.2 0.2"
          animation="property: rotation; to: 90 360 0; dur: 8000; easing: linear; loop: true">
        </a-gltf-model>

        <a-image 
          src="#tarjetaImg" 
          position="1 0 0.1" 
          scale="0 0 0"
          animation="property: scale; to: 0.8 1.2 1; dur: 1000; delay: 500; easing: easeOutElastic">
        </a-image>

      </a-entity>

    </a-scene>
  </body>
</html>
